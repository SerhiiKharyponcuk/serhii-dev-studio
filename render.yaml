services:
  - type: web
    name: serhii-dev-studio-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: .
    buildCommand: npm ci && npm run prisma:generate --workspace @serhii-dev/api && npm run build --workspace @serhii-dev/api
    startCommand: npm run prisma:migrate:deploy --workspace @serhii-dev/api && node apps/api/dist/src/server.js
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: serhii-dev-studio-db
          property: connectionString
      - key: WEB_ORIGIN
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: SETTINGS_ENCRYPTION_KEY
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: FILE_STORAGE
        value: s3
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: "false"

databases:
  - name: serhii-dev-studio-db
    plan: free
    region: frankfurt
    databaseName: serhii_dev_studio
    user: serhii_dev_studio
    postgresMajorVersion: "17"
    ipAllowList: []
